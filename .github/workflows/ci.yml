name: ci

# Unit tests and lint on every push. The tests use synthetic data only, so CI
# never needs the licensed LUCAS soil data or network access to data services.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ["3.14"]
        include:
          - os: ubuntu-24.04
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt ruff
      - run: python -m pip install -e .
      - name: lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: tests
        run: python -m pytest
